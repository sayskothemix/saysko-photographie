<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700">
  <rect width="1200" height="700" fill="#0b0e14"/>
  <text x="600" y="58" fill="#e3eefc" font-family="Georgia,serif" font-size="34" text-anchor="middle">FILL LIGHT — lumière de remplissage</text>
  <line x1="180" y1="78" x2="1020" y2="78" stroke="#c9a56a" stroke-opacity=".5"/>
  <text x="600" y="112" fill="#9fb2cc" font-family="Arial,sans-serif" font-size="15" letter-spacing="1.5" text-anchor="middle">UNE SOURCE DOUCE RELÈVE LES OMBRES SANS LES EFFACER</text>

  <!-- fond cyclorama -->
  <path d="M330 180 Q600 150 870 180 L870 560 Q600 585 330 560 Z" fill="#e8e9ec"/>
  <path d="M330 180 Q600 150 870 180 L870 560 Q600 585 330 560 Z" fill="#c9a56a" fill-opacity=".08"/>

  <!-- ombre douce projetée sur le fond, à droite du mannequin -->
  <ellipse cx="710" cy="400" rx="95" ry="150" fill="#000" fill-opacity=".13"/>

  <!-- mannequin : buste sur pied -->
  <g>
    <!-- socle -->
    <ellipse cx="600" cy="590" rx="70" ry="12" fill="#a9c7e8" fill-opacity=".25"/>
    <rect x="590" y="500" width="20" height="90" fill="#6d7c90"/>
    <!-- épaules / buste -->
    <path d="M520 500 Q520 380 600 372 Q680 380 680 500 Q600 520 520 500 Z" fill="#8d9bb0"/>
    <path d="M520 500 Q520 380 600 372 Q600 450 600 510 Q552 512 520 500 Z" fill="#b8c4d6"/>
    <!-- cou -->
    <rect x="583" y="340" width="34" height="45" rx="10" fill="#8d9bb0"/>
    <!-- tête (mannequin sans traits) -->
    <ellipse cx="600" cy="305" rx="46" ry="58" fill="#b8c4d6"/>
    <ellipse cx="600" cy="305" rx="46" ry="58" fill="#c9a56a" fill-opacity=".10"/>
  </g>

  <!-- softbox à gauche -->
  <g>
    <rect x="96" y="250" width="120" height="200" rx="6" fill="#101722" stroke="#a9c7e8" stroke-opacity=".4"/>
    <path d="M216 250 L268 280 L268 420 L216 450 Z" fill="#f4ead7"/>
    <path d="M268 280 L268 420 L400 380 L400 320 Z" fill="#f4ead7" fill-opacity=".10"/>
    <rect x="120" y="450" width="14" height="120" fill="#6d7c90"/>
    <ellipse cx="127" cy="572" rx="36" ry="8" fill="#6d7c90"/>
    <text x="156" y="228" fill="#c9a56a" font-family="Arial,sans-serif" font-size="16" text-anchor="middle" letter-spacing="2">SOFTBOX</text>
  </g>

  <!-- légendes -->
  <g font-family="Arial,sans-serif" font-size="15" fill="#9fb2cc">
    <line x1="930" y1="360" x2="1010" y2="360" stroke="#c9a56a" stroke-opacity=".6"/>
    <text x="1020" y="365">Ombre douce</text>
    <line x1="930" y1="430" x2="1010" y2="430" stroke="#c9a56a" stroke-opacity=".6"/>
    <text x="1020" y="435">Dégradé progressif</text>
    <text x="600" y="650" text-anchor="middle" fill="#9fb2cc">Peau lisse, transitions fondues — idéal pour un portrait naturel.</text>
  </g>
</svg>
