<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <rect width="800" height="500" fill="#0b0e14"/>
  <text x="400" y="48" fill="#e3eefc" font-family="Georgia,serif" font-size="30" text-anchor="middle">Rapport de lumière — Ratio</text>
  <text x="400" y="76" fill="#a9c7e8" font-family="Arial,sans-serif" font-size="14" letter-spacing="2" text-anchor="middle">KEY : FILL = INTENSITÉ RELATIVE DES DEUX SOURCES</text>

  <g font-family="Arial,sans-serif" text-anchor="middle">
    <!-- 1:1 -->
    <text x="140" y="125" fill="#c9a56a" font-size="18">1 : 1</text>
    <circle cx="100" cy="180" r="26" fill="#e8c98f"/>
    <circle cx="180" cy="180" r="26" fill="#e8c98f"/>
    <rect x="62" y="240" width="156" height="120" rx="8" fill="#101722" stroke="#a9c7e8" stroke-opacity=".35"/>
    <rect x="62" y="300" width="156" height="60" fill="#e8c98f" fill-opacity=".55"/>
    <text x="140" y="390" fill="#9fb2cc" font-size="13">Peu de contraste</text>

    <!-- 1:2 -->
    <text x="400" y="125" fill="#c9a56a" font-size="18">1 : 2</text>
    <circle cx="360" cy="180" r="26" fill="#e8c98f"/>
    <circle cx="440" cy="180" r="18" fill="#e8c98f" fill-opacity=".55"/>
    <rect x="322" y="240" width="156" height="120" rx="8" fill="#101722" stroke="#a9c7e8" stroke-opacity=".35"/>
    <rect x="322" y="270" width="156" height="90" fill="#e8c98f" fill-opacity=".55"/>
    <text x="400" y="390" fill="#9fb2cc" font-size="13">Contraste doux</text>

    <!-- 1:4 -->
    <text x="660" y="125" fill="#c9a56a" font-size="18">1 : 4</text>
    <circle cx="620" cy="180" r="26" fill="#e8c98f"/>
    <circle cx="700" cy="180" r="13" fill="#e8c98f" fill-opacity=".4"/>
    <rect x="582" y="240" width="156" height="120" rx="8" fill="#101722" stroke="#a9c7e8" stroke-opacity=".35"/>
    <rect x="582" y="285" width="156" height="75" fill="#e8c98f" fill-opacity=".55"/>
    <text x="660" y="390" fill="#9fb2cc" font-size="13">Contraste marqué</text>
  </g>

  <text x="400" y="455" fill="#9fb2cc" font-family="Arial,sans-serif" font-size="14" text-anchor="middle">Plus le rapport est élevé, plus l'ombre est profonde.</text>
</svg>
