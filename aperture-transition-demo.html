<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>Diaphragme reflex - transition SVG</title>
  <style>
    :root { color-scheme: dark; }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        linear-gradient(180deg, rgba(5,5,6,.05), rgba(5,5,6,.58)),
        url("galerie-portrait_nette.jpg") center 28% / cover no-repeat;
      font-family: Arial, Helvetica, sans-serif;
    }
    .page {
      width: 100vw;
      height: 100vh;
      height: 100svh;
      display: grid;
      place-items: end center;
      padding-bottom: clamp(36px, 7vh, 72px);
    }
    .enter {
      position: relative;
      z-index: 10;
      border: 0;
      background: transparent;
      color: rgba(255,255,255,.94);
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 18px #000;
      padding: 18px 24px;
    }
    .enter::after {
      content: "";
      display: block;
      width: 34px;
      height: 1px;
      margin: 12px auto 0;
      background: rgba(255,255,255,.82);
    }
    .enter:focus-visible {
      outline: 1px solid rgba(255,255,255,.8);
      outline-offset: 8px;
    }

    #camera-aperture {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    #camera-aperture.is-active {
      opacity: 1;
      visibility: visible;
    }
    #camera-aperture svg {
      width: 100%;
      height: 100%;
      display: block;
    }
  </style>
</head>
<body>
  <main class="page">
    <button class="enter" id="enter" type="button">Cliquez pour entrer</button>
  </main>

  <div id="camera-aperture" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice">
      <defs>
        <radialGradient id="metal" cx="34%" cy="28%" r="78%">
          <stop offset="0" stop-color="#343238"/>
          <stop offset=".22" stop-color="#17171a"/>
          <stop offset=".65" stop-color="#09090b"/>
          <stop offset="1" stop-color="#020203"/>
        </radialGradient>
        <radialGradient id="edge" cx="50%" cy="50%" r="55%">
          <stop offset=".7" stop-color="#17171a"/>
          <stop offset=".82" stop-color="#050506"/>
          <stop offset="1" stop-color="#000"/>
        </radialGradient>
        <mask id="iris-mask" maskUnits="userSpaceOnUse"
              x="-50" y="-50" width="200" height="200">
          <rect x="-50" y="-50" width="200" height="200" fill="white"/>
          <circle id="iris-hole" cx="50" cy="50" r="72" fill="black"/>
        </mask>
      </defs>

      <rect x="-50" y="-50" width="200" height="200"
            fill="#000" mask="url(#iris-mask)"/>
      <g id="mechanical-iris" mask="url(#iris-mask)">
        <circle cx="50" cy="50" r="74" fill="url(#edge)" opacity=".92"/>
        <g id="aperture-blades"></g>
        <circle cx="50" cy="50" r="1.25" fill="#050506" opacity=".9"/>
      </g>
    </svg>
  </div>

  <script>
    (() => {
      "use strict";

      const overlay = document.getElementById("camera-aperture");
      const svg = overlay.querySelector("svg");
      const hole = document.getElementById("iris-hole");
      const bladeGroup = document.getElementById("aperture-blades");
      const bladeCount = 12;
      const blades = [];

      function polar(cx, cy, radius, angle) {
        const a = (angle - 90) * Math.PI / 180;
        return [cx + Math.cos(a) * radius, cy + Math.sin(a) * radius];
      }

      function makeBladePath(angle, innerRadius) {
        const sector = 360 / bladeCount;
        const overlap = 5;
        const outerA = angle - sector * 0.46 - overlap;
        const outerB = angle + sector * 0.46 + overlap;
        const innerA = angle - sector * 0.38;
        const innerB = angle + sector * 0.38;

        const oa = polar(50, 50, 82, outerA);
        const ob = polar(50, 50, 82, outerB);
        const ib = polar(50, 50, innerRadius, innerB);
        const ia = polar(50, 50, innerRadius, innerA);

        return `M ${oa[0].toFixed(2)} ${oa[1].toFixed(2)}
                L ${ob[0].toFixed(2)} ${ob[1].toFixed(2)}
                L ${ib[0].toFixed(2)} ${ib[1].toFixed(2)}
                L ${ia[0].toFixed(2)} ${ia[1].toFixed(2)} Z`;
      }

      for (let i = 0; i < bladeCount; i++) {
        const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
        path.setAttribute("fill", i % 2 ? "url(#metal)" : "#101014");
        path.setAttribute("stroke", i % 3 ? "#35343a" : "#24242a");
        path.setAttribute("stroke-width", ".16");
        path.setAttribute("vector-effect", "non-scaling-stroke");
        path.setAttribute("d", makeBladePath(i * (360 / bladeCount), 72));
        bladeGroup.appendChild(path);
        blades.push(path);
      }

      function setIris(innerRadius) {
        hole.setAttribute("r", String(innerRadius));
        blades.forEach((blade, i) => {
          blade.setAttribute(
            "d",
            makeBladePath(i * (360 / bladeCount), innerRadius)
          );
        });
      }

      const ease = t =>
        t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function animateIris(from, to, duration) {
        return new Promise(resolve => {
          const start = performance.now();

          function frame(now) {
            const raw = Math.min(1, (now - start) / duration);
            const value = from + (to - from) * ease(raw);
            setIris(value);

            if (raw < 1) {
              requestAnimationFrame(frame);
            } else {
              resolve();
            }
          }

          requestAnimationFrame(frame);
        });
      }

      function playShutter() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;

        let ctx;
        try {
          ctx = new Context();
        } catch (_) {
          return;
        }

        if (ctx.state === "suspended") ctx.resume();
        const now = ctx.currentTime;

        const length = Math.floor(ctx.sampleRate * 0.16);
        const buffer = ctx.createBuffer(1, length, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < length; i++) {
          data[i] =
            (Math.random() * 2 - 1) *
            Math.exp(-i / (ctx.sampleRate * 0.025));
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1850;
        filter.Q.value = 0.75;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.46, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.17);

        const slap = ctx.createOscillator();
        const slapGain = ctx.createGain();
        slap.type = "triangle";
        slap.frequency.setValueAtTime(210, now);
        slap.frequency.exponentialRampToValueAtTime(55, now + 0.11);
        slapGain.gain.setValueAtTime(0.0001, now);
        slapGain.gain.exponentialRampToValueAtTime(0.15, now + 0.006);
        slapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        slap.connect(slapGain);
        slapGain.connect(ctx.destination);
        slap.start(now);
        slap.stop(now + 0.15);
      }

      let busy = false;

      function close(duration = 900) {
        overlay.classList.add("is-active");
        overlay.style.pointerEvents = "auto";
        return animateIris(72, 0, duration);
      }

      function open(duration = 900) {
        return animateIris(0, 72, duration).then(() => {
          overlay.style.pointerEvents = "none";
          overlay.classList.remove("is-active");
        });
      }

      async function playTransition(options = {}) {
        if (busy) return;
        busy = true;
        playShutter();
        await close(options.closeDuration || 900);
        await new Promise(resolve =>
          setTimeout(resolve, options.hold ?? 200)
        );
        await open(options.openDuration || 900);
        busy = false;
      }

      setIris(72);

      window.ApertureTransition = { close, open, playTransition };

      document.getElementById("enter").addEventListener("click", () => {
        playTransition({
          closeDuration: 900,
          hold: 200,
          openDuration: 900
        });
      });
    })();
  </script>
</body>
</html>
