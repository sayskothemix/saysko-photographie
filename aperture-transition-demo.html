<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Diaphragme reflex - Transition plein ecran</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: Arial, Helvetica, sans-serif;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; }
    body {
      overflow: hidden;
      background:
        linear-gradient(rgba(8, 8, 9, 0.18), rgba(8, 8, 9, 0.62)),
        url("galerie-portrait_nette.jpg") center 28% / cover no-repeat;
    }
    .demo {
      width: 100vw;
      height: 100svh;
      min-height: 100vh;
      display: grid;
      place-items: end center;
      padding-bottom: clamp(34px, 7vh, 72px);
    }
    .trigger {
      appearance: none;
      border: 0;
      background: transparent;
      color: #fff;
      cursor: pointer;
      font-size: 12px;
      letter-spacing: 4px;
      text-transform: uppercase;
      text-shadow: 0 2px 18px #000;
      padding: 18px 24px;
    }
    .trigger::after {
      content: "";
      display: block;
      width: 34px;
      height: 1px;
      margin: 12px auto 0;
      background: rgba(255,255,255,.82);
    }
    .trigger:focus-visible {
      outline: 1px solid rgba(255,255,255,.75);
      outline-offset: 8px;
    }

    #camera-aperture {
      position: fixed;
      inset: 0;
      z-index: 9999;
      width: 100vw;
      height: 100vh;
      height: 100svh;
      pointer-events: none;
      opacity: 0;
      visibility: hidden;
    }
    #camera-aperture.is-active {
      opacity: 1;
      visibility: visible;
    }
    #camera-aperture svg {
      display: block;
      width: 100%;
      height: 100%;
    }
    .aperture-blade {
      fill: #09090a;
      stroke: #242225;
      stroke-width: 0.32;
      vector-effect: non-scaling-stroke;
      filter: drop-shadow(0 0 1.2px rgba(255,255,255,.08));
    }
    .aperture-blade:nth-child(3n) {
      fill: #101011;
      stroke: #2b292d;
    }
    .aperture-blade:nth-child(2n) {
      fill: #070708;
    }
  </style>
</head>
<body>
  <main class="demo">
    <button class="trigger" id="enter" type="button">Cliquez pour entrer</button>
  </main>

  <div id="camera-aperture" aria-hidden="true">
    <svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Diaphragme reflex">
      <g id="aperture-blades"></g>
      <circle cx="50" cy="50" r="2.2" fill="#030304" opacity="0"></circle>
    </svg>
  </div>

  <script>
    (() => {
      "use strict";

      const overlay = document.getElementById("camera-aperture");
      const bladeGroup = document.getElementById("aperture-blades");
      const bladeCount = 12;
      const blades = [];

      const points = "50,50 36,4 64,4 68,50";

      for (let i = 0; i < bladeCount; i++) {
        const blade = document.createElementNS("http://www.w3.org/2000/svg", "polygon");
        blade.setAttribute("points", points);
        blade.setAttribute("class", "aperture-blade");
        blade.setAttribute("data-index", String(i));
        bladeGroup.appendChild(blade);
        blades.push({
          node: blade,
          angle: i * (360 / bladeCount)
        });
      }

      function setScale(scale) {
        blades.forEach(({ node, angle }) => {
          node.setAttribute(
            "transform",
            `translate(50 50) rotate(${angle}) scale(${scale}) translate(-50 -50)`
          );
        });
      }

      const easeInOut = t =>
        t < 0.5
          ? 4 * t * t * t
          : 1 - Math.pow(-2 * t + 2, 3) / 2;

      function animateScale(from, to, duration, onComplete) {
        const start = performance.now();
        function frame(now) {
          const raw = Math.min(1, (now - start) / duration);
          const eased = easeInOut(raw);
          setScale(from + (to - from) * eased);
          if (raw < 1) {
            requestAnimationFrame(frame);
          } else if (onComplete) {
            onComplete();
          }
        }
        requestAnimationFrame(frame);
      }

      function playShutter() {
        const Context = window.AudioContext || window.webkitAudioContext;
        if (!Context) return;

        let ctx;
        try {
          ctx = new Context();
        } catch (_) {
          return;
        }

        if (ctx.state === "suspended") ctx.resume();
        const now = ctx.currentTime;

        const bufferLength = Math.floor(ctx.sampleRate * 0.18);
        const buffer = ctx.createBuffer(1, bufferLength, ctx.sampleRate);
        const data = buffer.getChannelData(0);
        for (let i = 0; i < bufferLength; i++) {
          const envelope = Math.exp(-i / (ctx.sampleRate * 0.028));
          data[i] = (Math.random() * 2 - 1) * envelope;
        }

        const noise = ctx.createBufferSource();
        noise.buffer = buffer;
        const filter = ctx.createBiquadFilter();
        filter.type = "bandpass";
        filter.frequency.value = 1850;
        filter.Q.value = 0.75;
        const gain = ctx.createGain();
        gain.gain.setValueAtTime(0.0001, now);
        gain.gain.exponentialRampToValueAtTime(0.48, now + 0.006);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
        noise.connect(filter);
        filter.connect(gain);
        gain.connect(ctx.destination);
        noise.start(now);
        noise.stop(now + 0.19);

        const slap = ctx.createOscillator();
        const slapGain = ctx.createGain();
        slap.type = "triangle";
        slap.frequency.setValueAtTime(210, now);
        slap.frequency.exponentialRampToValueAtTime(55, now + 0.11);
        slapGain.gain.setValueAtTime(0.0001, now);
        slapGain.gain.exponentialRampToValueAtTime(0.16, now + 0.006);
        slapGain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
        slap.connect(slapGain);
        slapGain.connect(ctx.destination);
        slap.start(now);
        slap.stop(now + 0.15);
      }

      let busy = false;

      function close(duration = 900) {
        return new Promise(resolve => {
          overlay.classList.add("is-active");
          overlay.style.pointerEvents = "auto";
          animateScale(0.08, 1, duration, resolve);
        });
      }

      function open(duration = 900) {
        return new Promise(resolve => {
          animateScale(1, 0.08, duration, () => {
            overlay.style.pointerEvents = "none";
            overlay.classList.remove("is-active");
            setScale(0.08);
            resolve();
          });
        });
      }

      async function playTransition(options = {}) {
        if (busy) return;
        busy = true;

        const closeDuration = options.closeDuration || 900;
        const openDuration = options.openDuration || 900;
        const hold = options.hold ?? 200;

        playShutter();
        await close(closeDuration);
        if (hold > 0) await new Promise(resolve => setTimeout(resolve, hold));
        await open(openDuration);
        busy = false;
      }

      setScale(0.08);

      window.ApertureTransition = {
        close,
        open,
        playTransition
      };

      document.getElementById("enter").addEventListener("click", () => {
        playTransition({
          closeDuration: 900,
          hold: 200,
          openDuration: 900
        });
      });
    })();
  </script>
</body>
</html>
