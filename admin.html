<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin — Saysko Photographie</title>
<style>
  :root { --bg:#080b12; --surface:#101722; --text:#f7f9fc; --muted:#9fb2cc; --accent:#8fc4ff; --accent-2:#e3eefc; --danger:#d96a5f; }
  * { box-sizing:border-box; }
  body { margin:0; background:radial-gradient(circle at 50% -10%, #1b1720 0, var(--bg) 55%); color:var(--text); font-family:Georgia,'Times New Roman',serif; min-height:100vh; }
  .wrap { max-width:920px; margin:0 auto; padding:48px 22px 90px; }
  h1 { font-weight:400; letter-spacing:2px; margin:0 0 6px; }
  h1 span { color:var(--accent); }
  .sub { color:var(--muted); font-size:.85rem; letter-spacing:1px; text-transform:uppercase; margin-bottom:34px; }
  .card { background:var(--surface); border:1px solid rgba(143,196,255,.16); padding:26px; margin-bottom:22px; }
  .card h2 { font-weight:400; color:var(--accent); margin:0 0 18px; letter-spacing:1px; font-size:1.05rem; }
  label { display:block; font-size:.7rem; letter-spacing:1.5px; text-transform:uppercase; color:var(--muted); margin:14px 0 6px; }
  input, textarea { width:100%; background:#100e13; border:1px solid rgba(143,196,255,.22); color:var(--text); padding:12px 13px; font:inherit; }
  textarea { min-height:110px; resize:vertical; }
  button { cursor:pointer; border:1px solid var(--accent); background:linear-gradient(135deg,var(--accent),var(--accent-2)); color:#14100a; padding:11px 18px; letter-spacing:1.5px; text-transform:uppercase; font-size:.68rem; font-weight:700; margin-top:16px; }
  button.ghost { background:none; color:var(--accent); }
  button.danger { background:none; color:var(--danger); border-color:rgba(217,106,95,.5); }
  button.small { padding:7px 10px; margin:0; font-size:.6rem; }
  .row { display:flex; gap:10px; flex-wrap:wrap; align-items:end; }
  .row > div { flex:1; min-width:180px; }
  .msg { margin-top:14px; font-size:.85rem; color:var(--muted); min-height:1.2em; }
  .msg.ok { color:#9fd6a0; } .msg.err { color:var(--danger); }
  .photos { display:grid; grid-template-columns:repeat(auto-fill,minmax(240px,1fr)); gap:14px; margin-top:8px; }
  .ph { border:1px solid rgba(255,255,255,.07); background:#100e13; }
  .ph img { width:100%; aspect-ratio:4/5; object-fit:cover; display:block; }
  .ph .body { padding:10px 12px 12px; }
  .ph h3 { margin:0 0 4px; font-size:.85rem; font-weight:500; }
  .ph p { margin:0 0 10px; color:var(--muted); font-size:.72rem; }
  .ph .btns { display:flex; gap:6px; }
  .ph .btns button { flex:1; margin:0; padding:7px 4px; }
  .m { border-bottom:1px solid rgba(255,255,255,.06); padding:12px 0; }
  .m:last-child { border-bottom:0; }
  .m b { color:var(--accent); }
  .m small { color:var(--muted); display:block; margin:3px 0 6px; }
  .m p { margin:0 0 8px; white-space:pre-wrap; }
  .hidden { display:none !important; }
  .topline { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
  .who { color:var(--muted); font-size:.75rem; letter-spacing:1px; text-transform:uppercase; }
  .who b { color:var(--accent); }
  @media (max-width:600px){ .wrap{padding:30px 14px 70px} }
</style>
</head>
<body>
<div class="wrap">
  <div class="topline">
    <div>
      <h1>SAYSKO <span>ADMIN</span></h1>
      <div class="sub">Gestion du portfolio et des messages</div>
    </div>
    <a href="index.html" style="color:var(--accent);text-decoration:none;font-size:.7rem;letter-spacing:2px;text-transform:uppercase;">← Retour au site</a>
  </div>

  <div class="card" id="loginCard">
    <h2>Connexion</h2>
    <div class="row">
      <div><label for="u">Identifiant</label><input id="u" autocomplete="username"></div>
      <div><label for="p">Mot de passe</label><input id="p" type="password" autocomplete="current-password"></div>
    </div>
    <button id="loginBtn">Se connecter</button>
    <div class="msg" id="loginMsg"></div>
  </div>

  <div id="panel" class="hidden">
    <div class="card">
      <div class="topline">
        <h2 style="margin:0">Session</h2>
        <div class="who">Connecté : <b id="who"></b> <span id="role"></span></div>
      </div>
      <button class="ghost" id="logoutBtn">Déconnexion</button>
      <div class="msg" id="panelMsg"></div>
    </div>

    <div class="card" id="photosCard">
      <h2>Photos de la galerie</h2>
      <div class="row" id="addRow">
        <div><label for="npTitle">Titre</label><input id="npTitle"></div>
        <div><label for="npSrc">Fichier image (ex. galerie-x.jpg)</label><input id="npSrc"></div>
        <div><label for="npDesc">Description</label><input id="npDesc" placeholder="Portrait · Studio"></div>
        <div><button id="addPhoto">Ajouter</button></div>
      </div>
      <div class="msg" id="photosMsg"></div>
      <div class="photos" id="photos"></div>
    </div>

    <div class="card adminOnly hidden" id="emailCard">
      <h2>Email de contact</h2>
      <div class="row"><div><label for="email">Adresse email</label><input id="email" type="email"></div><div><button id="saveEmail">Enregistrer</button></div></div>
      <div class="msg" id="emailMsg"></div>
    </div>

    <div class="card adminOnly hidden" id="messagesCard">
      <h2>Messages reçus</h2>
      <div id="messages"></div>
      <div class="msg" id="messagesMsg"></div>
    </div>

    <div class="card adminOnly hidden" id="passCard">
      <h2>Mot de passe admin</h2>
      <div class="row">
        <div><label for="oldP">Ancien mot de passe</label><input id="oldP" type="password"></div>
        <div><label for="newP">Nouveau mot de passe</label><input id="newP" type="password"></div>
        <div><button id="savePass">Changer</button></div>
      </div>
      <div class="msg" id="passMsg"></div>
    </div>

    <div class="card adminOnly hidden" id="resetCard">
      <h2>Zone sensible</h2>
      <p style="color:var(--muted);font-size:.85rem">Réinitialise la galerie et l’email avec les valeurs par défaut du serveur.</p>
      <button class="danger" id="resetBtn">Réinitialiser le site</button>
      <div class="msg" id="resetMsg"></div>
    </div>
  </div>
</div>
<script>
(function(){
  'use strict';
  var state = { user:null, photos:[], email:'' };
  function $(id){ return document.getElementById(id); }
  function msg(id, text, ok){ var el=$(id); el.textContent=text||''; el.className='msg'+(ok===true?' ok':ok===false?' err':''); }
  function api(path, opts){
    opts = opts || {};
    opts.credentials = 'same-origin';
    if (opts.body && typeof opts.body !== 'string') { opts.body = JSON.stringify(opts.body); opts.headers = Object.assign({'Content-Type':'application/json'}, opts.headers||{}); }
    return fetch(path, opts).then(function(r){ return r.json().catch(function(){ return {ok:false,error:'Réponse invalide'}; }); });
  }
  function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }

  function render(){
    var logged = !!state.user;
    $('loginCard').className = logged ? 'card hidden' : 'card';
    $('panel').className = logged ? '' : 'hidden';
    if (!logged) return;
    $('who').textContent = state.user.username;
    $('role').textContent = '(' + state.user.role + ')';
    var admin = state.user.role === 'admin';
    document.querySelectorAll('.adminOnly').forEach(function(el){ el.classList.toggle('hidden', !admin); });
    $('addRow').style.display = admin ? '' : 'none';
    if (admin) $('email').value = state.email || '';
    renderPhotos();
    if (admin) loadMessages();
  }

  function renderPhotos(){
    var box = $('photos'); box.innerHTML = '';
    state.photos.forEach(function(p,i){
      var d = document.createElement('div'); d.className='ph';
      var canEdit = state.user && state.user.role==='admin';
      d.innerHTML = '<img src="'+esc(p.src)+'" alt=""><div class="body"><h3>'+esc(p.title)+'</h3><p>'+esc(p.desc||'')+'</p><div class="btns">'+
        (canEdit ? '<button class="small ghost" data-edit="'+i+'">Modifier</button><button class="small danger" data-del="'+i+'">Suppr.</button>' : '') +
        '</div></div>';
      box.appendChild(d);
    });
    box.querySelectorAll('[data-edit]').forEach(function(b){ b.onclick=function(){ editPhoto(+b.getAttribute('data-edit')); }; });
    box.querySelectorAll('[data-del]').forEach(function(b){ b.onclick=function(){ delPhoto(+b.getAttribute('data-del')); }; });
  }

  function load(){
    api('/api/state').then(function(d){
      state.user = d.user || null;
      var payload = d.data || d;
      state.photos = (payload && payload.photos) || [];
      state.email = (payload && payload.email) || '';
      render();
    }).catch(function(){ msg('loginMsg','Serveur admin indisponible. Lancez <code>node server.js</code> dans le dossier du site.', false); });
  }

  $('loginBtn').onclick = function(){
    msg('loginMsg','Connexion…');
    api('/api/login',{method:'POST',body:{username:$('u').value.trim(),password:$('p').value}}).then(function(d){
      if (d.ok) { $('p').value=''; load(); }
      else msg('loginMsg', d.error || 'Connexion impossible.', false);
    });
  };
  $('logoutBtn').onclick = function(){ api('/api/logout',{method:'POST'}).then(load); };

  $('addPhoto').onclick = function(){
    var body = { title:$('npTitle').value.trim(), src:$('npSrc').value.trim(), desc:$('npDesc').value.trim() };
    if (!body.title || !body.src) { msg('photosMsg','Titre et image requis.', false); return; }
    api('/api/photos',{method:'POST',body:body}).then(function(d){
      if (d.ok) { state.photos = d.photos || state.photos; $('npTitle').value=''; $('npSrc').value=''; $('npDesc').value=''; msg('photosMsg','Photo ajoutée.', true); renderPhotos(); }
      else msg('photosMsg', d.error || 'Erreur.', false);
    });
  };

  function editPhoto(i){
    var p = state.photos[i]; if (!p) return;
    var title = prompt('Titre', p.title); if (title === null) return;
    var src = prompt('Fichier image', p.src); if (src === null) return;
    var desc = prompt('Description', p.desc || ''); if (desc === null) return;
    api('/api/photos/update',{method:'POST',body:{action:'edit',index:i,title:title,src:src,desc:desc}}).then(function(d){
      if (d.ok) { state.photos = d.photos || state.photos; msg('photosMsg','Photo modifiée.', true); renderPhotos(); }
      else msg('photosMsg', d.error || 'Erreur.', false);
    });
  }
  function delPhoto(i){
    if (!confirm('Supprimer cette photo ?')) return;
    api('/api/photos/update',{method:'POST',body:{action:'delete',index:i}}).then(function(d){
      if (d.ok) { state.photos = d.photos || state.photos; msg('photosMsg','Photo supprimée.', true); renderPhotos(); }
      else msg('photosMsg', d.error || 'Erreur.', false);
    });
  }

  $('saveEmail').onclick = function(){
    api('/api/email',{method:'POST',body:{email:$('email').value.trim()}}).then(function(d){
      if (d.ok) { state.email = d.email || $('email').value.trim(); msg('emailMsg','Email enregistré.', true); }
      else msg('emailMsg', d.error || 'Erreur.', false);
    });
  };

  function loadMessages(){
    api('/api/messages').then(function(d){
      var box = $('messages'); box.innerHTML='';
      (d.messages||[]).forEach(function(m){
        var div = document.createElement('div'); div.className='m';
        div.innerHTML = '<b>'+esc(m.name)+'</b> <small>'+esc(m.email)+' — '+esc(m.date)+'</small><p>'+esc(m.message)+'</p><button class="small danger" data-id="'+esc(m.id)+'">Supprimer</button>';
        box.appendChild(div);
      });
      box.querySelectorAll('[data-id]').forEach(function(b){ b.onclick=function(){ delMessage(b.getAttribute('data-id')); }; });
      if (!(d.messages||[]).length) box.innerHTML = '<p style="color:var(--muted)">Aucun message.</p>';
    });
  }
  function delMessage(id){
    api('/api/messages/delete',{method:'POST',body:{id:id}}).then(function(){ loadMessages(); msg('messagesMsg','Message supprimé.', true); });
  }

  $('savePass').onclick = function(){
    api('/api/password',{method:'POST',body:{oldPassword:$('oldP').value,newPassword:$('newP').value}}).then(function(d){
      if (d.ok) { $('oldP').value=''; $('newP').value=''; msg('passMsg','Mot de passe changé.', true); }
      else msg('passMsg', d.error || 'Erreur.', false);
    });
  };
  $('resetBtn').onclick = function(){
    if (!confirm('Réinitialiser vraiment la galerie et l’email ?')) return;
    api('/api/reset',{method:'POST'}).then(function(d){
      if (d.ok) { state.photos = d.photos || []; state.email = d.email || ''; msg('resetMsg','Site réinitialisé.', true); render(); }
      else msg('resetMsg', d.error || 'Erreur.', false);
    });
  };

  load();
})();
</script>
</body>
</html>
